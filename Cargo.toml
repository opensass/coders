[workspace]

[package]
name = "coders"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "💻 A highly customizable inline code and code block component for WASM frameworks like Yew, Dioxus, and Leptos."
license = "MIT"
keywords = ["code", "yew", "dioxus", "leptos", "coders"]
categories = ["web-programming", "science"]
repository = "https://github.com/opensass/coders"
documentation = "https://docs.rs/coders"
authors = ["Mahmoud Harmouch <oss@wiseai.dev>"]
exclude = ["/assets", "/examples"]

[dependencies]
yew = { version = "0.23.0", default-features = false, optional = true }
dioxus = { version = "0.7.10", optional = true }
leptos = { version = "0.8.21", optional = true }
dioxus-logger = { version = "0.7.10", optional = true }
web-sys = { version = "0.3.106", features = ["Clipboard", "Navigator", "Window"], optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }

[features]
yew = ["dep:yew", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
dio = ["dioxus", "dioxus-logger", "gloo-timers", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
lep = ["leptos", "gloo-timers", "dep:web-sys", "dep:wasm-bindgen-futures"]

[profile.release]
opt-level = "z"
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
bump2version = "0.2.2"
